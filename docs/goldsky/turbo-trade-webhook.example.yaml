name: aurove-turbo-trade-webhook
resource_size: s
description: Turbo pipeline example that forwards raw trade logs into the Aurove internal event endpoint.
# Swap the source below for any Turbo source that already exposes raw log fields.

sources:
  x2y2_trade:
    type: subgraph_entity
    name: trade
    subgraphs:
      - name: x2y2
        version: 1.0.0

transforms:
  normalized_trade_events:
    type: sql
    primary_key: id
    sql: |
      SELECT
        id,
        chain_id AS "chainId",
        contract_address AS "contractAddress",
        block_number AS "blockNumber",
        block_hash AS "blockHash",
        block_timestamp AS "blockTimestamp",
        tx_hash AS "txHash",
        log_index AS "logIndex",
        transaction_index AS "transactionIndex",
        topics,
        data,
        removed,
        'goldsky-turbo' AS "provider"
      FROM x2y2_trade

sinks:
  aurove_events:
    type: webhook
    from: normalized_trade_events
    url: http://localhost:3000/api/internal/events
    secret_name: AUROVE_EVENTS_WEBHOOK_AUTH
    one_row_per_request: true
    headers:
      Content-Type: application/json

# Configure AUROVE_EVENTS_WEBHOOK_AUTH as a Goldsky httpauth secret whose
# header/value pair matches your dApp webhook auth settings.
# If you want to use Authorization, store Authorization: Bearer <EVENTS_WEBHOOK_SECRET>.
